[package]
name = "rtci-stream-driver"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A tokio driver for the stream transports (ICE-TCP, TURN over TCP and TLS) of a sans-I/O WebRTC engine"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "tokio", "tcp", "ice-tcp", "turn"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
# SRV and NAPTR lookups for `StreamCommand::ResolveRecords` (RFC 5928, RFC 8489 section 8)
# and AAAA / A answered separately (`StreamEvent::ResolvedFamily`, RFC 8305 section 3), with
# hickory-resolver (MIT OR Apache-2.0). Without it records are answered as none and both
# families together, through the system resolver. hickory 0.26.2 or later: 0.25 carries
# RUSTSEC-2026-0491 (memory amplification from a response's record counts, reachable from any
# name server the client asks) and DNSSEC advisories (not compiled in: no `dnssec-*` feature).
dns-records = ["dep:hickory-resolver"]
# `peer`: a whole `rtci` peer connection driven over sockets the driver owns, UDP included,
# gathering again by itself when a transport needs new candidates (`OnLocalCandidatesNeeded`).
# On by default. `rtci` dev-depends on this crate without a version and without this feature,
# so the two are published in the order rtc, then rtci-stream-driver.
default = ["peer"]
peer = ["dep:rtci", "dep:bytes"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["ifaces"] }
tokio.workspace = true
socket2.workspace = true
hickory-resolver = { version = "0.26.2", optional = true, default-features = false, features = ["tokio", "system-config"] }
rtci = { version = "0.1.0", path = "../..", optional = true }
bytes = { workspace = true, optional = true }

# The `peer` module's tests need the feature (on by default; off in the workspace jobs that
# build with `--no-default-features`).
[[test]]
name = "peer"
required-features = ["peer"]
