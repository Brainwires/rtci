[package]
name = "rtc-datachannel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
sansio = "1"

[dependencies.rtc-datachannel]
path = ".."

[dependencies.rtc-sctp]
path = "../../rtc-sctp"

[dependencies.rtc-shared]
path = "../../rtc-shared"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "message_unmarshal"
path = "fuzz_targets/message_unmarshal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_channel_handle_read"
path = "fuzz_targets/data_channel_handle_read.rs"
test = false
doc = false
bench = false
