[package]
name = "rtci-ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A C ABI over WebRTC.rs's sans-I/O engine, and an optional driven layer that owns its sockets"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "ffi", "sans-io"]
categories = ["network-programming", "api-bindings"]
# Not published to crates.io: a C library, delivered as built binaries and a header
# (docs/packaging.md), not as a Rust dependency.
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["driver"]
# The driven layer (`rtci_driven_*`, `rtci_mux_*`): a peer connection that owns its sockets and a
# background thread, on the reference tokio driver (`examples/stream-driver`).
driver = ["dep:tokio", "dep:stream-driver"]

[dependencies]
rtci = { path = "..", version = "0.1.0" }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
stream-driver = { workspace = true, optional = true }

# The tests of the driven layer need it; with default features off (the workspace's crypto and
# coverage jobs) they are skipped, not built against a library without `rtci_driven_*`.
[[test]]
name = "driven"
required-features = ["driver"]

[[test]]
name = "c_loopback"
required-features = ["driver"]

[dev-dependencies]
serde_json.workspace = true
# Compiles the C test program (tests/c/loopback.c) against the static library.
cc = "1.2"
