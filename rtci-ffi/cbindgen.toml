# The C header of rtci-ffi, generated by cbindgen and checked in (rtci-ffi/include/rtci.h).
# Regenerate after changing the interface:
#
#     cbindgen --config rtci-ffi/cbindgen.toml --crate rtci-ffi --output rtci-ffi/include/rtci.h
#
# CI (cargo.yml, job "C header up to date") regenerates it and fails on a difference.
language = "C"
include_guard = "RTCI_FFI_H"
autogen_warning = "/* Generated by cbindgen from rtci-ffi/src; do not edit. See rtci-ffi/cbindgen.toml. */"
header = """/*
 * The C interface of WebRTC.rs's sans-I/O engine (rtci-ffi). MIT OR Apache-2.0.
 *
 * Rules: every function returns an int32_t status (RTCI_OK, RTCI_EMPTY or a negative RTCI_ERR_*);
 * rtci_last_error() describes the last error of the calling thread. Handles are freed by their
 * _free function, returned strings by rtci_string_free(). A rtci_pc handle is not thread-safe:
 * calls on one handle must not overlap. Times are monotonic nanoseconds on the caller's origin.
 * See docs/packaging.md.
 */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
# The driven layer is in the default build; a build without the `driver` feature defines
# RTCI_FFI_NO_DRIVER before including the header.
after_includes = """
#if !defined(RTCI_FFI_NO_DRIVER) && !defined(RTCI_FFI_DRIVER)
#define RTCI_FFI_DRIVER 1
#endif"""
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"

[export]
prefix = ""
include = ["RtcAddr", "RtcTransport", "RtcMessage"]

[export.rename]
"PcHandle" = "rtci_pc"
"RtcAddr" = "rtci_addr"
"RtcTransport" = "rtci_transport"
"RtcMessage" = "rtci_message"
"DrivenHandle" = "rtci_driven"
"MuxHandle" = "rtci_mux"
"RtcDrivenCallback" = "rtci_driven_callback"

[parse]
parse_deps = false

[defines]
"feature = driver" = "RTCI_FFI_DRIVER"
