[package]
name = "rtc-sframe"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-I/O SFrame (RFC 9605) end-to-end media encryption"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "sframe", "e2ee", "encryption", "sans-io"]
categories = ["cryptography", "multimedia"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs"]

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]

[dependencies]
crypto.workspace = true

thiserror.workspace = true
zeroize.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
