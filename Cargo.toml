[workspace]
members = [
    "rtc-crypto",
    "rtc-datachannel",
    "rtc-dtls",
    "rtc-ice",
    "rtc-interceptor",
    "rtc-interceptor-derive",
    "rtc-media",
    "rtc-mdns",
    "rtc-rtcp",
    "rtc-rtp",
    "rtc-sctp",
    "rtc-sdp",
    "rtc-sframe",
    "rtc-shared",
    "rtc-srtp",
    "rtc-stun",
    "rtc-turn",
]
resolver = "2"

[profile.dev]
opt-level = 0

[workspace.package]
version = "0.22.0+brainwires.6"
authors = ["Rain Liu <yliu@webrtc.rs>"]
edition = "2024"
# The lowest toolchain the workspace builds on (checked by the MSRV job of cargo.yml).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webrtc-rs/rtc"

[workspace.dependencies]
crypto = { version = "0.22.0", path = "rtc-crypto", package = "rtc-crypto", default-features = false }
datachannel = { version = "0.22.0", path = "rtc-datachannel", package = "rtc-datachannel" }
dtls = { version = "0.22.0", path = "rtc-dtls", package = "rtc-dtls", default-features = false }
ice = { version = "0.22.0", path = "rtc-ice", package = "rtc-ice", default-features = false }
interceptor = { version = "0.22.0", path = "rtc-interceptor", package = "rtc-interceptor" }
interceptor-derive = { version = "0.22.0", path = "rtc-interceptor-derive", package = "rtc-interceptor-derive" }
mdns = { version = "0.22.0", path = "rtc-mdns", package = "rtc-mdns" }
media = { version = "0.22.0", path = "rtc-media", package = "rtc-media" }
rtcp = { version = "0.22.0", path = "rtc-rtcp", package = "rtc-rtcp" }
rtp = { version = "0.22.0", path = "rtc-rtp", package = "rtc-rtp" }
sctp = { version = "0.22.0", path = "rtc-sctp", package = "rtc-sctp" }
sdp = { version = "0.22.0", path = "rtc-sdp", package = "rtc-sdp" }
sframe = { version = "0.22.0", path = "rtc-sframe", package = "rtc-sframe", default-features = false }
shared = { version = "0.22.0", path = "rtc-shared", package = "rtc-shared", default-features = false }
srtp = { version = "0.22.0", path = "rtc-srtp", package = "rtc-srtp", default-features = false }
stun = { version = "0.22.0", path = "rtc-stun", package = "rtc-stun", default-features = false }
turn = { version = "0.22.0", path = "rtc-turn", package = "rtc-turn", default-features = false }
# The examples' signalling helper is not published: path only, so `cargo publish` drops the
# root crate's dev-dependency on it.
signal = { path = "examples/signal", package = "rtc-signal" }
stream-driver = { version = "0.22.0", path = "examples/stream-driver", package = "rtc-stream-driver" }

# common dependencies
sansio = "1"
bytes = "1.12.0"
byteorder = "1.5.0"
log = "0.4.33"
rcgen = { version = "0.14.8", features = ["pem"], default-features = false }
ring = "0.17.14"
aws-lc-rs = { version = "1.17.3", features = ["aws-lc-sys"], default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "2.0.18"
zeroize = "1.8.2"
pem = "3.0.3"
aes = "0.8.4"
ctr = "0.9.2"
ccm = "0.5.0"
md-5 = "0.10.6"
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
x509-parser = "0.16.0"
der-parser = "9.0.0"
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
rkyv = "0.8.17"
bytecheck = "0.8"
url = "2.5.0"
base64 = "0.22.1"
crc = "3.0.1"
precis-profiles = "0.2.0"
slab = "0.4.9"
crc32c = "0.6"
rustc-hash = "2"
memchr = "2.1.1"
socket2 = { version = "0.6", features = ["all"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
uuid = { version = "1", features = ["v4"] }
unicase = "2.8"
substring = "1.4.5"

# dev dependencies
env_logger = "0.11.11"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
criterion = "0.8.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.28.0"
# HTTP/1 only: the examples' signaling servers and clients. No `http2`, so no `h2`.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
lazy_static = "1.4.0"
hex = "0.4.3"
crossbeam-channel = "0.5"
assert_matches = "1.5.0"
nearly_eq = "0.2"
regex = "1.10.3"
ipnet = "2.9.0"
waitgroup = "0.1.2"
futures = "0.3.30"
futures-util = "0.3"
local-sync = "0.1.1"
core_affinity = "0.8.1"
anyhow = "1.0.80"

[package]
name = "rtc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A sans-I/O WebRTC implementation: peer connections with ICE, DTLS-SRTP, SCTP data channels, RTP/RTCP and JSEP negotiation"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "sans-io", "rtp", "ice", "dtls"]
categories = ["network-programming", "multimedia"]
readme = "README.md"
# The published crate is the library: its sources, the two test files its unit tests include,
# the README and the licence texts. The examples, integration tests, fixtures, documentation,
# test environment and CI files stay in the repository (`cargo publish` drops the example and
# test targets whose files are not in the package).
include = [
    "/src/**",
    "/tests/fixtures/browser-sdp/firefox-152--simulcast-three-rids-send--1-offer.sdp",
    "/tests/testdata/rsa_2048_offerer_key.pem",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs", "pem", "turn-tls-webpki-roots"]

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring", "dtls/crypto-ring", "rustls/ring", "rcgen/ring", "ice/crypto-ring", "stun/crypto-ring", "srtp/crypto-ring", "turn/crypto-ring", "sframe/crypto-ring"]
# Kept by the Brainwires fork (upstream removed them): see FORK.md.
openssl = ["srtp/openssl"]
vendored-openssl = ["srtp/vendored-openssl"]
pem = ["dtls/pem"]
# The Mozilla root certificates (webpki-roots, CDLA-Permissive-2.0) for the engine's TURN-over-TLS
# connections; without it the application gives roots or a verifier (`with_turn_tls`).
turn-tls-webpki-roots = ["dep:webpki-roots"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs", "dtls/crypto-aws-lc-rs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs", "ice/crypto-aws-lc-rs", "stun/crypto-aws-lc-rs", "srtp/crypto-aws-lc-rs", "turn/crypto-aws-lc-rs", "sframe/crypto-aws-lc-rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["marshal", "replay"] }
crypto.workspace = true
sansio.workspace = true
datachannel.workspace = true
dtls.workspace = true
ice.workspace = true
interceptor.workspace = true
mdns.workspace = true
media.workspace = true
rtcp.workspace = true
rtp.workspace = true
sctp.workspace = true
sdp.workspace = true
srtp.workspace = true
sframe.workspace = true
stun.workspace = true
turn.workspace = true

bytes.workspace = true
rustc-hash.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
rcgen.workspace = true
# `tls12`: the engine's TURN-over-TLS client offers TLS 1.2 beside TLS 1.3 (RFC 8656 3.1).
rustls = { workspace = true, features = ["tls12"] }
url.workspace = true
# Feature `turn-tls-webpki-roots`: the Mozilla roots for TURN over TLS.
webpki-roots = { version = "1", optional = true }
hex.workspace = true
base64.workspace = true
pem.workspace = true
x509-parser.workspace = true
unicase.workspace = true
rand.workspace = true

[dev-dependencies]
sansio.workspace = true
shared.workspace = true
ice.workspace = true
signal.workspace = true
stream-driver.workspace = true

tokio.workspace = true
env_logger.workspace = true
anyhow.workspace = true
clap.workspace = true
hyper.workspace = true
chrono.workspace = true
log.workspace = true
ctrlc.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

# Interop tests against the independent (pre-sans-I/O) webrtc implementation. 0.17.3 is the
# last release of that line, and the first whose DTLS uses p256 0.14 (crypto-bigint 0.7, past
# RUSTSEC-2026-0387) and no bincode. webrtc 0.20+ is built on the upstream `rtc` crates, so it
# would test this stack against its own lineage.
webrtc = "0.17.3"

# The test environment's TURN-over-TLS client speaks TLS 1.2: the environment's coturn fails
# every TLS 1.3 handshake (tests/testenv/mod.rs). Dev-only; the library's rustls is unchanged.
rustls = { workspace = true, features = ["tls12"] }

# The real-network test environment's tests (tests/testenv_*.rs) create sockets inside Linux
# network namespaces with setns(2).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

