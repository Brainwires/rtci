[package]
name = "rtci-stun"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "STUN messages, attributes and a sans-I/O client (RFC 8489), for WebRTC"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "stun", "nat-traversal", "ice", "sans-io"]
categories = ["network-programming", "parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs"]

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]
bench = []

[dependencies]
shared = { workspace = true, default-features = false, features = [] }
sansio.workspace = true
crypto.workspace = true

bytes.workspace = true
lazy_static.workspace = true
url.workspace = true
rand.workspace = true
base64.workspace = true
crc.workspace = true
precis-profiles.workspace = true

[dev-dependencies]
clap.workspace = true
criterion.workspace = true

[[bench]]
name = "bench"
harness = false

[[example]]
name = "stun_client"
path = "examples/stun_client.rs"
bench = false

[[example]]
name = "stun_decode"
path = "examples/stun_decode.rs"
bench = false
