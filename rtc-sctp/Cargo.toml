[package]
name = "rtc-sctp"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-I/O SCTP (RFC 9260) with partial reliability and stream reconfiguration, for WebRTC data channels"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "sctp", "datachannel", "sans-io"]
categories = ["network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
# Default features only: `bench` exposes internals to the benchmarks.
features = []

[features]
# Exposes the internal `fuzzing` module (marshal/unmarshal shims) for
# benchmarks and micro-benchmark harnesses without requiring the `--cfg fuzzing`
# build flag used by cargo-fuzz.
bench = []

[dependencies]
shared = { workspace = true, default-features = false, features = [] }
# The traits only: the hash of a State Cookie's MAC (RFC 9260 5.1.3) comes from the provider
# the application hands over. No cryptographic implementation is named here.
crypto.workspace = true

bytes.workspace = true
rand.workspace = true
thiserror.workspace = true
slab.workspace = true
log.workspace = true
crc32c.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# A provider for the State Cookie tests.
crypto = { workspace = true, features = ["crypto-ring"] }
assert_matches.workspace = true
lazy_static.workspace = true

[[example]]
name = "sctp_micro"
required-features = ["bench"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
