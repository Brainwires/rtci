name: cargo

on:
  push:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]
  pull_request:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 20
    name: Build
    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: cargo build --verbose

  test:
    timeout-minutes: 45
    # The name master's branch rules require (it carried the matrix's OS suffix before).
    name: Test (default backend) (ubuntu-latest)
    runs-on: ubuntu-latest
    # No incremental cache and no debug info (panics still print file:line): the test build of
    # the whole workspace filled the self-hosted Windows runner's disk (56 GB build directory).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run tests
        run: cargo test --verbose
      # rtci-stream-driver's optional DNS lookups (hickory-resolver) against a name server on
      # loopback: no other job turns the feature on.
      - name: Stream driver with dns-records
        run: cargo test --package rtci-stream-driver --features dns-records --lib --verbose
      # rtci-stream-driver without a built-in runtime (`default-features = false`, `peer`): it
      # builds, and its normal dependency tree holds no async runtime (the test runs
      # `cargo tree -e normal --no-default-features`). A tokio primitive left in the driver
      # would not build here; a tokio dependency left non-optional fails the test.
      - name: Stream driver without a built-in runtime (no tokio)
        run: |
          cargo check --package rtci-stream-driver --no-default-features --features peer --verbose
          cargo test --package rtci-stream-driver --test dependency_tree --verbose
      # The built-in runtimes other than tokio (off by default): their tests need the features.
      - name: Stream driver on every built-in runtime
        run: cargo test --package rtci-stream-driver --features runtime-smol,runtime-mock --verbose
      # Bring your own runtime: examples/custom-runtime implements `Runtime` over async-executor
      # and async-io and depends on the driver with `default-features = false`. Its tree must
      # hold no tokio (nor smol), and two peer connections on it must connect and exchange a
      # data-channel message (the program exits 1 otherwise).
      - name: Custom runtime example (no built-in runtime)
        shell: bash
        run: |
          cargo tree --edges normal --package rtci-custom-runtime-example --prefix none --format '{p}' > custom-runtime-tree.txt
          if grep -E '^(tokio|tokio-util|mio|smol|hickory-resolver) ' custom-runtime-tree.txt; then
            echo "an async runtime is in the custom-runtime example's dependency tree"
            exit 1
          fi
          cargo run --package rtci-custom-runtime-example --no-default-features --verbose
      - name: Disk left after the build
        if: always()
        run: df -h

  # macOS and Windows: the whole workspace's tests with default features, on our runners first
  # (GitHub's when ours are busy).
  #
  # Self-hosted runners only take a push or a pull request from a branch of this repository. A
  # pull request from a fork runs `test_platforms_fork` on GitHub's runners and never names our
  # labels (the fork's run still needs a maintainer's approval, and a fork can edit this file:
  # review `runs-on` and `.github/` changes before approving one).
  runners:
    name: pick runners
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@7475d2c4523faa74d428c3607a8fe195c1f782ac # pick-runners
        with:
          jobs: test_macos=macos-arm64 test_windows=windows-x64
          vars: ${{ toJSON(vars) }}
          runner-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  test_platforms:
    name: Test (${{ matrix.name }}, default features)
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}')[matrix.key] || matrix.github }}
    # Self-hosted only for a push or a same-repository pull request; never for
    # pull_request_target.
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !cancelled()
    timeout-minutes: 90
    # No incremental cache and no debug info (panics still print file:line): the test build of
    # the whole workspace filled the self-hosted Windows runner's disk (56 GB build directory).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy: &platform-strategy
      fail-fast: false
      matrix:
        include:
          - name: macOS
            key: test_macos
            github: macos-latest
          - name: Windows
            key: test_windows
            github: windows-latest
    steps: &platform-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # On GitHub's macOS image the multicast route leads to an interface that cannot carry it:
      # an mDNS send fails with "No route to host" and the mDNS interop tests time out. Both
      # peers of those tests are on this machine, so the route is moved to loopback. Our own
      # runners are left alone.
      - name: Multicast route over loopback (GitHub-hosted macOS)
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: |
          netstat -rn -f inet | grep -E '^(224|default)' || true
          sudo route -nq delete -net 224.0.0.0/4 || true
          sudo route -nq add -net 224.0.0.0/4 -interface lo0
          netstat -rn -f inet | grep -E '^224' || true
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast --verbose
      # The driver's mDNS on virtual time (`runtime-mock` is not a default feature): two
      # publishing drivers must connect, which catches a return of 0.1.0's socket matching on
      # every platform, not only where real multicast runs.
      - name: Stream driver mDNS on virtual time
        run: cargo test --package rtci-stream-driver --features runtime-mock --test mdns_virtual_time --verbose
      - name: Doctests
        run: cargo test --workspace --doc --verbose
      - name: Disk left after the build (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive C
      - name: Disk left after the build
        if: always() && runner.os != 'Windows'
        run: df -h

  # A pull request from a fork: the same tests on GitHub's runners only.
  test_platforms_fork:
    name: Test (${{ matrix.name }}, default features, fork pull request)
    runs-on: ${{ matrix.github }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    # No incremental cache and no debug info (panics still print file:line): the test build of
    # the whole workspace filled the self-hosted Windows runner's disk (56 GB build directory).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy: *platform-strategy
    steps: *platform-steps

  # The test inventory (no hidden or orphaned tests), upstream test parity, the fuzz target
  # registry, workflow hygiene (actions pinned by SHA, no self-hosted runner for a fork pull
  # request), the clause audit's counts and the nested lock files (`cargo metadata --locked`,
  # the runner's preinstalled cargo). Python only: no build.
  test_inventory:
    timeout-minutes: 20
    name: Test inventory, upstream parity, fuzz registry, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No hidden tests; every test the clause audit cites exists (and the gate's unit tests)
        run: python3 scripts/test_check_test_inventory.py && python3 scripts/check-test-inventory.py --check
      - name: Upstream test parity
        run: python3 scripts/check-test-parity.py
      - name: Every fuzz target is built and run
        run: python3 scripts/check-fuzz-registry.py
      - name: Actions pinned, self-hosted runners kept from fork pull requests
        run: python3 scripts/check-workflow-pins.py
      - name: Clause audit counts agree with the tables (COUNTS.md up to date)
        run: python3 scripts/audit-count.py --check
      - name: Old crate names stay out (the rename to rtci, docs/rename.md)
        run: python3 scripts/rename-to-rtci.py --check
      - name: Every open MUST row of the audit has a class (OPEN-MUST.md up to date)
        run: python3 scripts/open-must.py --check
      - name: The behaviour profile table is what the code says (docs/behaviour-profiles.md)
        run: python3 scripts/behaviour-profiles.py --check
      - name: Released CHANGELOG sections equal the latest release tag's (the newest tag that is an ancestor)
        run: python3 scripts/check-changelog-released.py
      - name: The released-sections gate's unit tests (which tag it compares with)
        run: python3 scripts/test_check_changelog_released.py
      - name: The committed nested Cargo.lock files resolve their manifests (--locked)
        run: python3 scripts/check-nested-locks.py
      - name: The performance ledger names its CHANGELOG tags, files and tests (docs/performance.md)
        run: python3 scripts/test_check_performance_ledger.py && python3 scripts/check-performance-ledger.py
      - name: No test talks to the public internet (public STUN/TURN servers, off-machine addresses)
        run: python3 scripts/test_check_no_public_network_in_tests.py && python3 scripts/check-no-public-network-in-tests.py

  # The `chrome-defaults` feature makes `BehaviourProfile::default()` Chrome, and with it every
  # default of the setting engine, media engine and interceptor options. One job, not a test
  # matrix: the workspace builds with it, and the profile's own tests pass with it (the other
  # suites assume the RFC defaults, which the feature replaces on purpose).
  chrome_defaults:
    timeout-minutes: 30
    name: Feature chrome-defaults (check, profile tests)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the workspace with the feature
        run: cargo check --workspace --all-targets --features rtci/chrome-defaults --verbose
      - name: The profile's tests with the feature
        run: |
          cargo test --package rtci --features chrome-defaults --lib behaviour_profile --verbose
          cargo test --package rtci --features chrome-defaults --test behaviour_profiles --verbose

  # The same for `performance-defaults` (BehaviourProfile::Performance as the default).
  performance_defaults:
    timeout-minutes: 30
    name: Feature performance-defaults (check, profile tests)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the workspace with the feature
        run: cargo check --workspace --all-targets --features rtci/performance-defaults --verbose
      - name: The profile's tests with the feature
        run: |
          cargo test --package rtci --features performance-defaults --lib behaviour_profile --verbose
          cargo test --package rtci --features performance-defaults --test behaviour_profiles --verbose

  crypto_backend_baseline:
    timeout-minutes: 45
    name: Crypto baseline (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # The whole workspace's test build of every feature set outgrew the hosted runner's disk
    # ("No space left on device"): no incremental cache and no debug info (panics still print
    # file:line). The `df -h` step at the end measures the headroom.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        backend: [ crypto-ring, crypto-aws-lc-rs ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast --lib --bins --examples --tests --no-default-features --features rtci/${{ matrix.backend }} --verbose
      - name: Test workspace documentation
        run: cargo test --workspace --doc --no-default-features --features rtci/${{ matrix.backend }} --verbose
      - name: Build standalone crypto consumers
        shell: bash
        run: |
          cargo check --package rtci-dtls --no-default-features --features ${{ matrix.backend }} --verbose
          cargo check --package rtci-srtp --no-default-features --features ${{ matrix.backend }} --verbose
          cargo check --package rtci-stun --no-default-features --features ${{ matrix.backend }} --verbose
          cargo check --package rtci-sframe --no-default-features --features ${{ matrix.backend }} --verbose
      - name: Disk left after the build
        if: always()
        run: df -h

  rtci_crypto_provider_matrix:
    timeout-minutes: 20
    name: rtci-crypto (${{ matrix.name }})
    runs-on: ubuntu-latest
    # No incremental cache and no debug info (panics still print file:line): the test build of
    # the whole workspace filled the self-hosted Windows runner's disk (56 GB build directory).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: --features test-support
          - name: ring
            args: --no-default-features --features crypto-ring,test-support
          - name: aws-lc-rs
            args: --no-default-features --features crypto-aws-lc-rs,test-support
          - name: ring + aws-lc-rs
            args: --no-default-features --features crypto-ring,crypto-aws-lc-rs,test-support
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test provider configuration
        run: cargo test --package rtci-crypto ${{ matrix.args }} --verbose
      - name: Disk left after the build
        if: always()
        run: df -h

  rtci_crypto_custom_provider:
    timeout-minutes: 20
    name: rtci-crypto (no built-in, custom provider)
    runs-on: ubuntu-latest
    # No incremental cache and no debug info (panics still print file:line): the test build of
    # the whole workspace filled the self-hosted Windows runner's disk (56 GB build directory).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test downstream-style provider
        run: cargo test --package rtci-crypto --no-default-features --features test-support --test custom_provider --verbose
      - name: Verify publishable package
        run: cargo package --package rtci-crypto --no-default-features
      - name: Disk left after the build
        if: always()
        run: df -h

  workspace_provider_matrix:
    timeout-minutes: 45
    name: Workspace (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The whole workspace's test build of every feature set outgrew the hosted runner's disk
    # ("No space left on device"): no incremental cache and no debug info (panics still print
    # file:line). The `df -h` step at the end measures the headroom.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: ring only
            args: --no-default-features --features crypto-ring
          - name: aws-lc-rs only
            args: --no-default-features --features crypto-aws-lc-rs
          # Both backends in one graph. This was a `compile_error!` before G3; it is now the
          # regression guard for Cargo feature additivity, since feature unification can enable
          # both from unrelated dependencies.
          - name: ring + aws-lc-rs
            args: --features crypto-ring,crypto-aws-lc-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Compiles the `assert_dyn_compatible` guard in rtci-crypto/src/lib.rs under this feature
      # set. `Arc<dyn RTCCryptoProvider>` is load-bearing for the whole design, and object
      # safety is lost silently by adding one generic method — possibly behind a feature flag.
      - name: Build workspace and dyn-compatibility guard
        run: cargo build --workspace --all-targets ${{ matrix.args }} --verbose
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast ${{ matrix.args }} --verbose
      - name: Doctests
        run: cargo test --workspace --doc ${{ matrix.args }} --verbose
      - name: Disk left after the build
        if: always()
        run: df -h

  standalone_crate_checks:
    timeout-minutes: 20
    name: Standalone crates (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [ crypto-ring, crypto-aws-lc-rs ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Crates that forward provider features must build on their own, not only as part of the
      # workspace, since standalone protocol users are a supported audience.
      - name: Check provider-forwarding crates
        run: |
          cargo check --package rtci-crypto --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-dtls   --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-srtp   --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-stun   --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-ice    --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-turn   --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
          cargo check --package rtci-sframe --no-default-features --features ${{ matrix.backend }} --all-targets --verbose
      # These perform no cryptography and must not have acquired a provider dependency.
      - name: Check crates that must stay crypto-free
        run: |
          cargo check --package rtci-shared --all-targets --verbose
          cargo check --package rtci-sctp   --all-targets --verbose
          cargo check --package rtci-rtp    --all-targets --verbose
          cargo check --package rtci-rtcp   --all-targets --verbose
          cargo check --package rtci-sdp    --all-targets --verbose
          cargo check --package rtci-media  --all-targets --verbose

  crypto_dependency_audit:
    timeout-minutes: 10
    name: Crypto dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Enforces the G3 invariant: rtci-crypto is the only crate naming a crypto implementation.
      # The script parses dependency sections so that provider-feature forwarding
      # (`ring = ["crypto/ring"]`) and the root `[workspace.dependencies]` table are not
      # mistaken for real dependencies.
      - name: No crypto implementation outside rtci-crypto
        run: python3 scripts/check-crypto-boundary.py
      - name: No mutually exclusive backend guards
        run: |
          if grep -rn 'At most one of the features' --include='*.rs' . ; then
            echo "A mutually exclusive backend compile_error! guard is still present."
            exit 1
          fi
      - name: No backend-name aliasing
        run: |
          if grep -rn 'extern crate aws_lc_rs as ring' --include='*.rs' . ; then
            echo "The aws-lc-rs-as-ring alias is still present."
            exit 1
          fi

  sans_io_deterministic_time_audit:
    timeout-minutes: 10
    name: Sans-I/O deterministic time boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Enforces the G4 invariant: sans-I/O protocol code is told the time, it does not ask.
      # An `Instant::now()` in the core cannot be driven by a virtual clock, which is what makes
      # timing-dependent behaviour untestable without sleeping. The allow-list is a ratchet:
      # counts go down as the migration lands, and a new read fails here. Removing a read also
      # fails, prompting `--snapshot` so the reduction is recorded. See docs/sans-io-deterministic-time.md.
      - name: No ambient clock reads outside the allow-list
        run: python3 scripts/check-sans-io-deterministic-time.py

  package_publication_order:
    timeout-minutes: 20
    name: cargo package (publication order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rtci-crypto is new in this release and has no intra-workspace dependencies, so it is the
      # first crate in publication order and the only one whose packaging can be verified from
      # a clean checkout today.
      - name: Package rtci-crypto first
        run: cargo package --package rtci-crypto --allow-dirty
      - name: Package crates with no rtci-crypto dependency
        run: cargo package --package rtci-shared --allow-dirty
      # Crates depending on rtci-crypto cannot be packaged one at a time until rtci-crypto at
      # this workspace's version is on crates.io: `cargo package -p` resolves the dependency
      # graph against the registry and the path dependency is stripped from the published
      # manifest. This is expected before the first publish, not a regression (docs/releasing.md
      # packages the whole workspace in one call, which resolves the workspace's own crates
      # locally). This step asserts the failure is exactly that
      # missing-version resolution error and nothing else, so a different packaging break is
      # still caught.
      - name: Confirm dependents block only on rtci-crypto publication
        run: |
          if cargo package --package rtci-stun --allow-dirty 2>package.log; then
            echo "rtci-stun packaged; rtci-crypto appears to be published."
            echo "Replace this step with a normal packaging check."
            exit 0
          fi
          if grep -qE 'failed to select a version for the requirement `rtci-crypto|no matching package named `rtci-crypto`' package.log; then
            echo "Expected: rtci-stun awaits the first rtci-crypto publish."
            exit 0
          fi
          echo "rtci-stun packaging failed for an unexpected reason:"
          cat package.log
          exit 1

  # The workspace builds on its declared `rust-version` (the workspace manifest), every
  # feature. Dependencies resolve to versions that support that toolchain where one exists.
  msrv:
    timeout-minutes: 30
    name: MSRV (rust-version, all features)
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain of the workspace's rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the workspace
        run: cargo check --workspace --all-features --verbose

  # What a call's user sees when the path's capacity collapses (tests/capacity_instrument.rs):
  # the pull-request ensemble in a release build, on GitHub's runners only: 630 runs, about
  # twelve minutes with the build (up to twice that on a slow runner). Its tripwires hold
  # every cell against the recorded baseline and its requirement tests are sized for a stated
  # power (the test file's doc). The fine comparison of a congestion-control, pacing,
  # retransmission or RTCP-timing change is capacity-compare.yml (docs/capacity-instrument.md).
  capacity_instrument:
    name: Capacity instrument (release ensemble)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: capacity-instrument
      - name: The analysis script's unit tests
        run: python3 scripts/test_capacity_instrument.py
      - name: Build the instrument (release)
        run: cargo test --release --package rtci --test capacity_instrument --no-run
      - name: Tripwires and requirements over the pull-request ensemble
        run: cargo test --release --package rtci --test capacity_instrument -- --ignored ensemble_
      # Within a process the ensemble test repeats runs on other threads; this repeats a
      # measurement in a second process, so that a figure that follows from an address, a hash
      # seed or a clock is noticed.
      - name: The same seeds give the same rows in a second process
        run: |
          for pass in 1 2; do
            RTC_INSTR_CELLS=pr RTC_INSTR_SEEDS=1-2 \
              cargo test --release --package rtci --test capacity_instrument -- --ignored --nocapture --exact measure > rows.$pass.log
            grep -o 'IROW .*' rows.$pass.log | sort > rows.$pass.txt
          done
          test -s rows.1.txt
          diff rows.1.txt rows.2.txt

  rustfmt_and_clippy:
    timeout-minutes: 30
    name: Check rustfmt style && run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: cargo clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
