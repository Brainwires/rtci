name: coverage

on:
  push:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]
  pull_request:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  grcov:
    name: Coverage (${{ matrix.crypto.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        toolchain:
          - nightly
        crypto:
          - name: ring
            features: crypto-ring
          - name: aws-lc-rs
            features: crypto-aws-lc-rs
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - name: Install grcov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: grcov

      - name: Test
        run: cargo test --workspace --no-fail-fast --no-default-features --features ${{ matrix.crypto.features }}
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "cargo-test-%p-%m.profraw"

      - name: Disk left after the build
        if: always()
        run: df -h

      - name: Generate coverage data
        id: grcov
        run: |
          grcov . \
              --binary-path ./target/debug/ \
              --source-dir . \
              --output-type lcov \
              --output-path lcov.info \
              --branch \
              --ignore='/**' \
              --ignore='C:/**' \
              --ignore='../**' \
              --ignore-not-existing \
              --excl-line "#\\[derive\\(" \
              --excl-br-line "#\\[derive\\(" \
              --excl-start "#\\[cfg\\(test\\)\\]" \
              --excl-br-start "#\\[cfg\\(test\\)\\]"
      - name: Upload coverage as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-${{ matrix.crypto.name }}.info
          # path: ${{ steps.grcov.outputs.report }}
          path: lcov.info

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          flags: ${{ matrix.crypto.name }}
          fail_ci_if_error: true
