name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2.0.1

      - name: Generate changelog for this release
        # The config is passed explicitly so the job does not depend on git-cliff's lookup
        # order (it was `.cliff.toml`, which the release job never found).
        run: |
          git cliff --config cliff.toml --current --output RELEASE_NOTES.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog
          path: RELEASE_NOTES.md

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Download changelog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # This workflow is the only one a version tag starts; release-binaries.yml is started by
      # hand only (docs/releasing.md).
      #
      # Publishing to crates.io stays manual for now: docs/releasing.md has the procedure (dry
      # runs, the order, what to do when a publish fails midway; crates.io versions are
      # permanent). When it moves here, uncomment the step below and add the CRATES_IO_TOKEN
      # secret. The order is dependencies first (normal, build and versioned dev-dependencies);
      # `cargo publish` waits until each crate is in the index before it returns, so the next
      # one resolves. A failure stops the step: fix, then publish the rest of the list from the
      # crate that failed (a published version cannot be published again).
      # - name: Publish crates
      #   run: |
      #     cargo publish -p rtc-crypto --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-interceptor-derive --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-sframe --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-shared --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-dtls --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-mdns --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-rtcp --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-rtp --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-interceptor --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-media --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-sctp --token ${{ secrets.CRATES_IO_TOKEN }}
      #     cargo publish -p rtc-datachannel --token ${{ secrets.CRATES_IO_TOKEN }}
