name: SemVer Check

on:
  push:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]
  pull_request:
    branches: [ master, v0.20.x, v0.21.x, v1.x ]

permissions:
  contents: read

jobs:
  semver:
    timeout-minutes: 30
    name: Check SemVer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline is a release tag, so the history and tags are needed.
          fetch-depth: 0

      # The baseline is the last release of the current line, from git, not crates.io: the
      # crates were renamed at 0.1.0 (docs/rename.md), so crates.io has no earlier version of
      # them. The last release is the newest tag reachable from HEAD; it counts only when it is
      # a plain `vX.Y.Z` (the `v0.22.0+brainwires.N` tags are the earlier line, under the old
      # crate names). Until the first such tag exists the job reports that and succeeds.
      - name: Find the baseline release
        id: baseline
        run: |
          tag=$(git tag --merged HEAD --sort=-creatordate --list 'v*' | head -n 1)
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice title=SemVer Check::No release of this line yet (newest tag: '${tag:-none}'); nothing to compare with, skipped."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.baseline.outputs.tag != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        if: steps.baseline.outputs.tag != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.tag != ''
        run: cargo install cargo-semver-checks --locked

      # Only the publishable crates that the baseline release also has are compared: a crate
      # new since the release has nothing to be compared with.
      - name: List the crates the baseline release also has
        id: crates
        if: steps.baseline.outputs.tag != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
        run: |
          git worktree add --detach ../semver-baseline "$BASELINE"
          names() {
            cargo metadata --no-deps --format-version 1 --manifest-path "$1" |
              python3 -c 'import json,sys; print("\n".join(sorted(p["name"] for p in json.load(sys.stdin)["packages"] if p.get("publish") != [])))'
          }
          packages=$(comm -12 <(names Cargo.toml) <(names ../semver-baseline/Cargo.toml) | tr '\n' ' ')
          if [ -z "${packages// /}" ]; then
            echo "::notice title=SemVer Check::No crate in common with $BASELINE; skipped."
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      # The required check: the release type comes from the manifests' version, so on a line
      # whose version already says what the next release is (0.2.0-dev after 0.1.0, see
      # docs/releasing.md) breaking changes pass here, and a patch line still fails on them.
      - name: Run cargo-semver-checks against the baseline tag
        if: steps.baseline.outputs.tag != '' && steps.crates.outputs.packages != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
          PACKAGES: ${{ steps.crates.outputs.packages }}
        run: |
          args=()
          for p in $PACKAGES; do args+=(--package "$p"); done
          cargo semver-checks --baseline-rev "$BASELINE" --default-features "${args[@]}"

      # Report only, never fails the job: the same comparison with the release type forced to
      # minor, so every breaking change since the baseline is listed even while the version
      # line allows it. Each one listed must be in CHANGELOG.md as Breaking.
      - name: Report breaking changes since the baseline (report only)
        if: always() && steps.baseline.outputs.tag != '' && steps.crates.outputs.packages != ''
        continue-on-error: true
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
          PACKAGES: ${{ steps.crates.outputs.packages }}
          CARGO_TERM_COLOR: never
        run: |
          args=()
          for p in $PACKAGES; do args+=(--package "$p"); done
          status=0
          cargo semver-checks --baseline-rev "$BASELINE" --default-features --release-type minor \
            "${args[@]}" > semver-report.log 2>&1 || status=$?
          cat semver-report.log
          {
            echo "## Breaking since $BASELINE (expected on the 0.2 line; each must be in the CHANGELOG as Breaking)"
            echo
            if [ "$status" -eq 0 ]; then
              echo "None: every compared crate passes as a minor release of $BASELINE."
            elif grep -q -- '^--- failure' semver-report.log; then
              echo '```'
              grep -E -- '^--- failure|^Failed in:|^  [a-z_]+ .* in .*:[0-9]+$|^  [^ ].*:[0-9]+$|^     Summary semver requires|^    Checking ' semver-report.log
              echo '```'
            else
              echo "cargo-semver-checks exited $status without a lint finding (tool or build error); see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
