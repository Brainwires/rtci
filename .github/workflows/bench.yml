name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the publishing job, which runs on a push to master and never on a
# pull request, may write (it pushes the results to the benchmark data branch).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# `bash` (not the default `bash -e`) adds `-o pipefail`, so a failing
# `cargo bench` fails its step instead of being hidden by `tee`.
defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Run criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      # Only the criterion `bench` target of each crate: `--output-format bencher`
      # is a criterion flag that libtest (the lib/test targets `cargo bench` also
      # runs) rejects. The bencher lines on stdout are what `tool: cargo` parses;
      # cargo's own stderr stays in the log only.
      - name: Run benchmarks (rtci-rtp)
        run: cargo bench -p rtci-rtp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-rtcp)
        run: cargo bench -p rtci-rtcp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-stun)
        run: cargo bench -p rtci-stun --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-sdp)
        run: cargo bench -p rtci-sdp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-srtp)
        run: cargo bench -p rtci-srtp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-turn)
        run: cargo bench -p rtci-turn --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtci-media)
        run: cargo bench -p rtci-media --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Keep the results for the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-all
          path: bench-all.txt

  publish:
    name: Publish benchmark results
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-all

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: WebRTC-RS Criterion Benchmarks
          tool: cargo
          output-file-path: bench-all.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if performance degrades by more than 10%
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: docs/benchmarks
