# cargo-deny: security advisories for the library's dependency graph only: normal and build
# dependencies of the published workspace crates, every feature, no dev-dependencies (so no
# interop tests or examples) and no `publish = false` member (rtci-video, its interop peer, the
# examples' signalling helper, fuzz: deny.toml checks those, with every feature). Nothing is
# ignored here, by design: an advisory reachable from a published crate fails CI.
# See deny.toml for the whole-workspace check and its documented exceptions.

[graph]
all-features = true
exclude-dev = true
exclude-unpublished = true

[advisories]
version = 2
