[package]
name = "rtc-shared"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared types of a sans-I/O WebRTC stack: marshalling traits, transport context, replay detection, the stream transport interface"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "sans-io", "marshal", "networking"]
categories = ["network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["ifaces", "marshal", "replay"]
ifaces = []
marshal = []
replay = []

[dependencies]
thiserror.workspace = true
substring.workspace = true
bytes.workspace = true
url.workspace = true
rand.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net"] }

[target.'cfg(windows)'.dependencies]
bitflags = "1.3"
winapi = { version = "0.3.9", features = [
    "basetsd",
    "guiddef",
    "ws2def",
    "winerror",
    "ws2ipdef",
] }
