[package]
name = "rtc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.rtc]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

