# The str0m peer of the interop matrix (scripts/test-env/peers/README.md). Its own workspace:
# it is not a member of the engine's, its dependencies never reach the engine's lock file,
# and it is built only in the test image (build.sh).
[package]
name = "str0m-peer"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
# The pinned release under test, with its pure-Rust crypto (dimpl over RustCrypto): no C in
# the peer's DTLS or SRTP.
str0m = { version = "=0.26.0", default-features = false, features = ["rust-crypto"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
