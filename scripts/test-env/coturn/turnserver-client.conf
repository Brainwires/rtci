# A third coturn for the TURN client tests (tests/testenv_turn_client.rs): same host, port 3480,
# its own relay ports. It relays on an IPv6 address as well (a loopback address of the "turn"
# namespace, which coturn/start.sh adds: the allocations are real, nothing is routed to them), so
# REQUESTED-ADDRESS-FAMILY and ADDITIONAL-ADDRESS-FAMILY (RFC 8656 7.1) get what they ask for,
# and it knows a second user, for a request made under another username than the allocation's
# (RFC 8656 5). UDP and TCP.
listening-ip=203.0.113.10
relay-ip=203.0.113.10
relay-ip=fd00:203:113::10
listening-port=3480
min-port=45000
max-port=48999
realm=rtc.test
lt-cred-mech
user=test:test
user=other:other
fingerprint
no-tls
no-dtls
no-cli
simple-log
log-file=stdout
verbose
pidfile=/run/rtc-env/turnserver-client.pid
