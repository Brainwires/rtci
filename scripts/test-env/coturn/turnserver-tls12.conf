# A fourth coturn, for the engine's TURN over TLS 1.2 (tests/testenv_turn_streams.rs): same
# host, TLS on 5350, its own relay ports, and TLS 1.2 at most, the way a server without TLS 1.3
# answers (a TLS 1.3 ClientHello that also offers 1.2 settles on 1.2, one offering 1.3 alone is
# refused). coturn has no option for a highest version, so coturn/start.sh runs this server with
# OPENSSL_CONF=coturn/openssl-tls12.cnf (MaxProtocol = TLSv1.2 for every SSL context). The main
# server (turnserver.conf, 5349) speaks TLS 1.3 and 1.2.
listening-ip=203.0.113.10
relay-ip=203.0.113.10
listening-port=3481
tls-listening-port=5350
min-port=35000
max-port=39999
realm=rtc.test
lt-cred-mech
user=test:test
fingerprint
cert=/run/rtc-env/turn.crt
pkey=/run/rtc-env/turn.key
no-dtls
no-cli
no-tlsv1
no-tlsv1_1
simple-log
log-file=stdout
pidfile=/run/rtc-env/turnserver-tls12.pid
