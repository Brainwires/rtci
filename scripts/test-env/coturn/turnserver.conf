# coturn for the test environment: STUN and TURN on the "turn" namespace's address only
# (203.0.113.10, inside the test container; nothing is published on the host).
listening-ip=203.0.113.10
relay-ip=203.0.113.10
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535
realm=rtc.test
lt-cred-mech
user=test:test
fingerprint
cert=/run/rtc-env/turn.crt
pkey=/run/rtc-env/turn.key
no-dtls
no-cli
no-tlsv1
no-tlsv1_1
simple-log
log-file=stdout
pidfile=/run/rtc-env/turnserver.pid
