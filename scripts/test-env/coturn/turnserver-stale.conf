# A second coturn for the TURN nonce test (tests/testenv_turn.rs): same host, port 3479, its own
# relay ports. Its nonces go stale after 10 s and its allocations last at most 30 s, so a client
# must answer a 438 Stale Nonce on Refresh / CreatePermission / ChannelBind (RFC 8656 4.4,
# RFC 8489 9.2.4) to keep a relayed call past half a minute. UDP and TCP only.
listening-ip=203.0.113.10
relay-ip=203.0.113.10
listening-port=3479
min-port=40000
max-port=44999
realm=rtc.test
lt-cred-mech
user=test:test
fingerprint
stale-nonce=10
max-allocate-lifetime=30
no-tls
no-dtls
no-cli
simple-log
log-file=stdout
# Each request's outcome ("incoming packet REFRESH processed, error 438: Stale nonce") is logged
# only in verbose mode; tests/testenv_turn.rs reads it to prove a 438 happened.
verbose
pidfile=/run/rtc-env/turnserver-stale.pid
