[package]
name = "rtc-audio"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-I/O audio pipeline for RTC: Opus, G.711, G.722, an adaptive jitter buffer with concealment and time-stretching, and audio processing"
license.workspace = true
documentation = "https://docs.rs/rtc-audio"
repository.workspace = true
keywords = ["webrtc", "audio", "opus", "jitter-buffer", "sans-io"]
categories = ["multimedia::audio", "network-programming"]
readme = "README.md"

# The default features are pure Rust and need no system library: the workspace's CI installs
# none. `libopus` builds the reference C codec (bundled source, CMake) and is opt-in.
[features]
default = ["opus", "engine"]
# Opus encode and decode through opus-rs (BSD-3-Clause), a pure-Rust port of libopus 1.6.
opus = ["dep:opus-rs"]
# Opus through the reference libopus (C, BSD-3-Clause) via opusic-sys (BSD-3-Clause), as a
# second backend and a reference the tests compare against.
libopus = ["dep:opusic-sys"]
# The glue that connects the pipelines to an `RTCRtpSender` / `RTCRtpReceiver` of the `rtc`
# peer connection. Without it the crate has no dependency on the engine.
engine = ["dep:rtc"]

[dependencies]
rtp.workspace = true
shared = { workspace = true, default-features = false, features = ["marshal"] }
bytes.workspace = true
log.workspace = true
thiserror.workspace = true

opus-rs = { version = "0.1.42", optional = true }
opusic-sys = { version = "0.7.7", optional = true }
# The engine with its default crypto backend (ring); `rtc` has no build without one.
rtc = { version = "0.22.0", path = "..", optional = true }

[dev-dependencies]
rtc = { version = "0.22.0", path = ".." }
anyhow.workspace = true

[[test]]
name = "pipeline_rtc2rtc"
path = "tests/pipeline_rtc2rtc.rs"
required-features = ["opus", "engine"]

[[example]]
name = "audio-loopback"
path = "examples/audio-loopback.rs"
required-features = ["opus", "engine"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
