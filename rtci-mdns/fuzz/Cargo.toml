[package]
name = "rtci-mdns-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
sansio = "1"

[dependencies.rtci-mdns]
path = ".."

[dependencies.rtci-shared]
path = "../../rtci-shared"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "mdns_handle_inbound"
path = "fuzz_targets/mdns_handle_inbound.rs"
test = false
doc = false
bench = false
