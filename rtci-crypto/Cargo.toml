[package]
name = "rtci-crypto"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral cryptography interface of a sans-I/O WebRTC stack, with ring and aws-lc-rs providers"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "crypto", "dtls", "srtp", "sans-io"]
categories = ["cryptography", "network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs", "test-support"]

[features]
default = ["crypto-ring"]
crypto-ring = ["dep:ring", "dep:aes", "dep:ctr", "dep:ccm", "dep:md-5", "dep:hmac", "dep:sha1", "dep:sha2"]
crypto-aws-lc-rs = ["dep:aws-lc-rs", "dep:aes", "dep:ctr", "dep:ccm", "dep:md-5", "dep:hmac", "dep:sha1"]
test-support = []
# Kept by the Brainwires fork for rtci-srtp's `openssl` feature: an OpenSSL AES-CTR stream
# cipher (`openssl_aes_ctr`). See FORK.md.
openssl = ["dep:openssl"]
vendored-openssl = ["openssl", "openssl/vendored"]

[dependencies]
aes = { workspace = true, optional = true }
ctr = { workspace = true, optional = true }
rand.workspace = true
ccm = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle.workspace = true
num-bigint.workspace = true
thiserror.workspace = true
zeroize.workspace = true
ring = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
openssl = { version = "0.10.72", optional = true }

[dev-dependencies]
pem.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
