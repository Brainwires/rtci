# The C header of rtc-ffi, generated by cbindgen and checked in (rtc-ffi/include/rtc.h).
# Regenerate after changing the interface:
#
#     cbindgen --config rtc-ffi/cbindgen.toml --crate rtc-ffi --output rtc-ffi/include/rtc.h
#
# CI (cargo.yml, job "C header up to date") regenerates it and fails on a difference.
language = "C"
include_guard = "RTC_FFI_H"
autogen_warning = "/* Generated by cbindgen from rtc-ffi/src; do not edit. See rtc-ffi/cbindgen.toml. */"
header = """/*
 * The C interface of WebRTC.rs's sans-I/O engine (rtc-ffi). MIT OR Apache-2.0.
 *
 * Rules: every function returns an int32_t status (RTC_OK, RTC_EMPTY or a negative RTC_ERR_*);
 * rtc_last_error() describes the last error of the calling thread. Handles are freed by their
 * _free function, returned strings by rtc_string_free(). A rtc_pc handle is not thread-safe:
 * calls on one handle must not overlap. Times are monotonic nanoseconds on the caller's origin.
 * See docs/packaging.md.
 */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
# The driven layer is in the default build; a build without the `driver` feature defines
# RTC_FFI_NO_DRIVER before including the header.
after_includes = """
#if !defined(RTC_FFI_NO_DRIVER) && !defined(RTC_FFI_DRIVER)
#define RTC_FFI_DRIVER 1
#endif"""
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"

[export]
prefix = ""
include = ["RtcAddr", "RtcTransport", "RtcMessage"]

[export.rename]
"PcHandle" = "rtc_pc"
"RtcAddr" = "rtc_addr"
"RtcTransport" = "rtc_transport"
"RtcMessage" = "rtc_message"
"DrivenHandle" = "rtc_driven"
"MuxHandle" = "rtc_mux"
"RtcDrivenCallback" = "rtc_driven_callback"

[parse]
parse_deps = false

[defines]
"feature = driver" = "RTC_FFI_DRIVER"
